<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 76" fill="none">
  <defs>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
    <linearGradient id="chromeAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Demon Crest Icon -->
  <g transform="translate(6, 6)">
    <!-- Demon Outer Glow -->
    <path d="M32 4 L42 22 L54 16 L46 36 L52 56 L32 64 L12 56 L18 36 L10 16 L22 22 Z" 
          fill="none" stroke="#A855F7" stroke-width="2" opacity="0.4" filter="url(#neonBlur)" />
    
    <!-- Main Crest Body -->
    <path d="M32 6 L40 22 L50 18 L43 35 L48 53 L32 60 L16 53 L21 35 L14 18 L24 22 Z" 
          fill="url(#purpleGlow)" stroke="#FFFFFF" stroke-width="1.5" />
    
    <!-- Demon Horns Accent -->
    <path d="M22 22 L14 16 C12 10, 16 4, 20 2 C22 8, 26 14, 28 20 Z" fill="#E879F9" />
    <path d="M42 22 L50 16 C52 10, 48 4, 44 2 C42 8, 38 14, 36 20 Z" fill="#E879F9" />
    
    <!-- Core Angular Eyes -->
    <polygon points="23,34 30,37 25,41" fill="#FFFFFF" filter="url(#neonBlur)" />
    <polygon points="41,34 34,37 39,41" fill="#FFFFFF" filter="url(#neonBlur)" />
    
    <!-- Center Sharp Diamond Accent -->
    <polygon points="32,26 35,33 32,40 29,33" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Typography -->
  <g transform="translate(76, 18)">
    <!-- Primary Title -->
    <text x="0" y="24" font-family="'Unbounded', -apple-system, sans-serif" font-weight="900" font-size="21" letter-spacing="1.5" fill="url(#chromeAccent)">
      ФИОЛЕТОВЫЙ <tspan fill="#C084FC" filter="url(#neonBlur)">ДЕМОН</tspan>
    </text>
    <!-- Subtitle / Tagline -->
    <text x="2" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" letter-spacing="2.5" fill="#A855F7">
      PREMIUM DETAILING STUDIO • САРАТОВ
    </text>
  </g>
</svg>
